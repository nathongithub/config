[window]
padding = { x = 12, y = 12 }
decorations = "full"
opacity = 1.00
startup_mode = "Windowed"
title = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[terminal]
shell = { program = "/bin/bash" }

[keyboard]
bindings = [
  { key = "V",      mods = "Control|Shift", action = "Paste"           },
  { key = "C",      mods = "Control|Shift", action = "Copy"            },
  { key = "Key0",   mods = "Control",       action = "ResetFontSize"   },
  { key = "Equals", mods = "Control",       action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control",       action = "DecreaseFontSize" },
  { key = "F11",    mods = "None",          action = "ToggleFullscreen" },
]

# -----------------------------------------------
# TokyoNight Storm
# -----------------------------------------------

[colors.primary]
background = "#24283b"
foreground = "#c0caf5"

[colors.cursor]
text   = "#24283b"
cursor = "#c0caf5"

[colors.selection]
text       = "#c0caf5"
background = "#364a82"

[colors.normal]
black   = "#1d202f"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[colors.hints.start]
foreground = "#24283b"
background = "#e0af68"

[colors.hints.end]
foreground = "#24283b"
background = "#a9b1d6"
